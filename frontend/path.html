<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose your learning path</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="js/auth.js"></script></head><body><header class="topbar"><div class="container topbar-inner"><a class="brand" href="index.html"><span class="brand-mark">P</span><span>Personalized Learning</span></a><div style="margin-left:auto"><button class="btn btn-secondary" onclick="Auth.signOut()">Sign out</button></div></div></header><main class="page"><div class="container"><div class="page-head"><div><div class="eyebrow">Step 01 · Learning path</div><h1>What are you learning for?</h1><p>Choose the school learning path you want to explore.</p></div></div><div id="cards" class="choice-grid"></div><div class="hero-actions"><button id="continue" class="btn btn-primary" disabled>Continue</button></div><div id="notice" class="footer-note"></div></div></main><script>
const options=[{id:'school',title:'School — Classes 5–9',desc:'Build strong foundations',body:'For students in Classes 5–9.',focus:'Mathematics · General concepts · Practice · Progress-based learning'}];
let selected=null;const cards=document.getElementById('cards');options.forEach(o=>{const b=document.createElement('button');b.className='choice';b.innerHTML=`<h3>${o.title}</h3><p>${o.desc}</p><div class="mini">${o.body}<br>${o.focus}</div>`;b.onclick=()=>{document.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selected=o.id;document.getElementById('continue').disabled=false};cards.appendChild(b)});
document.getElementById('continue').onclick=()=>{if(!selected)return;const profile=Auth.getDemoProfile()||{};Auth.saveProfile({...profile,path:selected});location.href='goal.html'};

</script><script src="js/api.js"></script><script>(async()=>{const user=await Auth.currentAuth();if(user){const p=Auth.getDemoProfile()||{};sessionStorage.removeItem('pl_ai_greeted_session');localStorage.setItem('hackmysore_student_id','101');Auth.saveProfile({...p,name:user.user_metadata?.full_name||user.email?.split('@')[0]||p.name||'Learner',email:user.email,student_id:101,mode:'google'});}const s=document.createElement('script');s.src='js/ai-assistant.js';document.body.appendChild(s);})()</script></body></html>
