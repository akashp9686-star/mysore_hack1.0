<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Select your goal</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="js/auth.js"></script></head><body><header class="topbar"><div class="container topbar-inner"><a class="brand" href="index.html"><span class="brand-mark">P</span><span>Personalized Learning</span></a></div></header><main class="page"><div class="container"><div class="page-head"><div><div class="eyebrow">Step 02 · Goal</div><h1>What do you want to learn?</h1><p>Choose a learning area. Mathematics and General concepts have separate learning spaces.</p></div></div><div id="goals" class="choice-grid"></div><div class="hero-actions"><button id="continue" class="btn btn-primary" disabled>Continue</button></div></div></main><script>
const items=[
 {id:'Mathematics',title:'Mathematics',desc:'Class-specific mathematics curriculum for Classes 5–9.',mini:'Each class has its own topics, basic video lessons, MCQs and progress-based question selection.'},
 {id:'General concepts',title:'General Concepts',desc:'Broader learning areas beyond mathematics.',mini:'Communication Skills · Spell Talk · Chess Learning · Brainstorm — content space ready for later.'}
];
const p=Auth.getDemoProfile()||{};let chosen=null;const wrap=document.getElementById('goals');items.forEach(x=>{const b=document.createElement('button');b.className='choice';b.innerHTML=`<h3>${x.title}</h3><p>${x.desc}</p><div class="mini">${x.mini}</div>`;b.onclick=()=>{document.querySelectorAll('.choice').forEach(y=>y.classList.remove('selected'));b.classList.add('selected');chosen=x.id;document.getElementById('continue').disabled=false};wrap.appendChild(b)});
document.getElementById('continue').onclick=()=>{Auth.saveProfile({...p,path:'school',goal:chosen});location.href='profile.html'};
</script><script src="js/api.js"></script><script src="js/ai-assistant.js"></script></body></html>
